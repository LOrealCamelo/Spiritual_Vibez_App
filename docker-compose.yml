version: "3.9"
services:
  auramystic-api:
    build: .
    container_name: auramystic-api
    ports:
      - "8000:8000"
    environment:
      - AURAMYSTIC_DB_PATH=/app/backend/data/auramystic.db
    volumes:
      - auramystic_data:/app/backend/data
    restart: unless-stopped

volumes:
  auramystic_data:
