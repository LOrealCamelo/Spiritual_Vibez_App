name: Firefox and WebKit compatibility
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            frontend/tests/requirements.txt
      - run: pip install -r backend/requirements.txt -r frontend/tests/requirements.txt
      - name: Use the official Ubuntu mirror for browser dependencies
        run: |
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          import re
          candidates = [Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('*.sources'), *Path('/etc/apt/sources.list.d').glob('*.list')]
          for path in candidates:
              if not path.is_file():
                  continue
              before = path.read_text()
              after = re.sub(r'https?://[^/\s]+\.ec2\.archive\.ubuntu\.com/ubuntu/?', 'https://archive.ubuntu.com/ubuntu/', before)
              if after != before:
                  path.write_text(after)
          PYTHON
      - name: Install real Firefox and WebKit with their required libraries
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '120000'
        run: python -m playwright install --with-deps firefox webkit
      - name: Provide virtual audio output for real browser playback
        run: |
          sudo apt-get install --yes --no-install-recommends pulseaudio libasound2-plugins
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=spiritual_vibz_test
          pactl set-default-sink spiritual_vibz_test
          pactl info
      - name: Test real browser engines against an isolated local backend
        run: python frontend/tests/browser_compat.py --screenshots "$RUNNER_TEMP/browser-compat"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: browser-compat-evidence
          path: ${{ runner.temp }}/browser-compat
          if-no-files-found: warn
