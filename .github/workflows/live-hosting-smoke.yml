name: Live Cloudflare and Render smoke check

on:
  push:
    paths:
      - '.github/workflows/live-hosting-smoke.yml'
      - '.github/scripts/live-hosting-smoke.py'
  workflow_dispatch:

jobs:
  hosting-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Probe real FastAPI endpoints from outside Render and Cloudflare
        run: python .github/scripts/live-hosting-smoke.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-hosting-smoke-report
          path: hosting-smoke-report.json
          if-no-files-found: warn
