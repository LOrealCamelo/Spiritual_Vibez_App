name: Backend and browser tests
on:
  push:
    branches: [main, design/spiritual-vibez-mobile-refresh]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Run backend suite
        run: python backend/tests/test_all_endpoints.py
      - name: Run pytest
        run: pytest -q backend/tests
      - name: Syntax-check browser app
        run: |
          node --check frontend/app.js
          node --check frontend/cosmic.js
          node --check frontend/artwork.js
          node --check frontend/learning.js
          node --check frontend/content-format.js
          node --check frontend/content-actions.js
      - name: Check shared result formatting and PNG assets
        run: node --test frontend/tests/*.test.cjs

      - name: Install browser test driver
        run: pip install -r frontend/tests/requirements.txt
      - name: Test connected web routes and reference layouts in Chrome
        env:
          BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: python frontend/tests/browser_flows.py --screenshots "$RUNNER_TEMP/web-evidence"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: spiritual-vibez-web-evidence
          path: ${{ runner.temp }}/web-evidence
          if-no-files-found: warn
          retention-days: 7
