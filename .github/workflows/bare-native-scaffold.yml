name: Scaffold bare React Native iOS / Android
on:
  push:
    branches: [feature/spiritual-vibez-bare-react-native]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    if: "!contains(github.event.head_commit.message, '[skip scaffold]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate native iOS and Android host projects
        shell: bash
        run: |
          npx --yes @react-native-community/cli@20.0.0 init SpiritualVibez --version 0.83.0 --skip-install --directory "$RUNNER_TEMP/SpiritualVibezNative"
          cp -R "$RUNNER_TEMP/SpiritualVibezNative/android" mobile/android
          cp -R "$RUNNER_TEMP/SpiritualVibezNative/ios" mobile/ios
          cp "$RUNNER_TEMP/SpiritualVibezNative/Gemfile" mobile/Gemfile
      - name: Convert approved WebP illustrations into local PNG files
        run: |
          python -m pip install pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          src=Path('frontend/assets')
          dst=Path('mobile/assets')
          dst.mkdir(exist_ok=True, parents=True)
          for original in src.glob('*.webp'):
              png=dst/(original.stem+'.png')
              with Image.open(original) as image:
                  image.save(png,format='PNG',optimize=True)
              print('Created',png)
          assert len(list(dst.glob('*.png'))) >= 17
          PY
      - name: Commit native projects and PNG artwork to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/android mobile/ios mobile/Gemfile mobile/assets
          git commit -m "Generate bare iOS/Android host projects and local PNG artwork [skip scaffold]"
          git push origin HEAD:feature/spiritual-vibez-bare-react-native
