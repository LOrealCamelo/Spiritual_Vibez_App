name: Scaffold bare React Native iOS / Android
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    if: "!contains(github.event.head_commit.message, '[skip scaffold]')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Generate native iOS and Android host projects
        shell: bash
        run: |
          npx --yes @react-native-community/cli@20.0.0 init SpiritualVibez --version 0.83.0 --skip-install --directory "$RUNNER_TEMP/SpiritualVibezNative"
          cp -R "$RUNNER_TEMP/SpiritualVibezNative/android/." mobile/android/
          cp -R "$RUNNER_TEMP/SpiritualVibezNative/ios/." mobile/ios/
          cp "$RUNNER_TEMP/SpiritualVibezNative/Gemfile" mobile/Gemfile
      - name: Commit native projects to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/android mobile/ios mobile/Gemfile
          git commit -m "Generate bare iOS/Android host projects [skip scaffold]"
          git push origin HEAD:feature/spiritual-vibez-bare-react-native
