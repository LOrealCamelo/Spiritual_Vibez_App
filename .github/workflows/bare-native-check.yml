name: Bare React Native build checks
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "frontend/**"
      - ".github/workflows/bare-native-check.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "frontend/**"
      - ".github/workflows/bare-native-check.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: PNG assets, UI tests, TypeScript and Metro
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked bare React Native dependencies
        run: npm ci --no-audit --no-fund
      - name: Resolve every local PNG reference and audit native hosts
        run: |
          npm run check:assets
          npm run check:native
      - name: Asset validator regression tests
        run: npm run test:assets
      - name: Verify web frontend uses uploaded PNGs
        run: node --test ../frontend/tests/assets.test.cjs
      - name: Type-check all React Native screens
        run: npm run typecheck
      - name: Test card actions, progress, journal and tab navigation
        run: npm test -- --runInBand
      - name: Metro production bundles (Android and iOS)
        run: |
          npm run bundle:android -- --bundle-output "$RUNNER_TEMP/sv.android.bundle" --assets-dest "$RUNNER_TEMP/sv-android-assets"
          npx react-native bundle --platform ios --dev false --entry-file index.js --max-workers 2 --bundle-output "$RUNNER_TEMP/sv.ios.bundle" --assets-dest "$RUNNER_TEMP/sv-ios-assets"
          test -s "$RUNNER_TEMP/sv.android.bundle"
          test -s "$RUNNER_TEMP/sv.ios.bundle"
  android:
    name: Android assembleDebug (arm64)
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install locked dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Compile native Android debug app
        working-directory: mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v7
        with:
          name: spiritual-vibez-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
  ios:
    name: iOS Release build and iPhone simulator launch
    needs: native
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: mobile
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install locked JavaScript and native iOS dependencies
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          bundle config set --local path vendor/bundle
          bundle install --jobs 4 --retry 3
          cd ios
          bundle exec pod install
      - name: Compile the actual iOS app with its bundled JavaScript and PNGs
        working-directory: mobile/ios
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -workspace SpiritualVibez.xcworkspace -scheme SpiritualVibez -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/sv-ios-build" -jobs 3 CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES ARCHS="$(uname -m)" build 2>&1 | tee "$RUNNER_TEMP/sv-ios-build.log"
      - name: Start the backend for the simulator
        run: |
          python -m pip install -r backend/requirements.txt
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/sv-ios-backend.log" 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/sv-ios-backend.log"
          exit 1
      - name: Boot an iPhone, install and launch the app, and capture its screen
        run: bash mobile/scripts/ios-simulator-smoke.sh "$RUNNER_TEMP/sv-ios-build/Build/Products/Release-iphonesimulator/SpiritualVibez.app" "$RUNNER_TEMP/sv-ios-evidence"
      - name: Upload iPhone simulator evidence and build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spiritual-vibez-ios-simulator
          path: |
            ${{ runner.temp }}/sv-ios-evidence
            ${{ runner.temp }}/sv-ios-build.log
            ${{ runner.temp }}/sv-ios-backend.log
          if-no-files-found: warn
          retention-days: 7
