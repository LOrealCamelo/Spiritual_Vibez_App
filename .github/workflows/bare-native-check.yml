name: Bare React Native build checks
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/bare-native-check.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/bare-native-check.yml"
  workflow_dispatch:
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify local PNG assets and native host projects
        shell: bash
        run: |
          test -f mobile/ios/SpiritualVibez.xcodeproj/project.pbxproj
          test -f mobile/android/gradle/wrapper/gradle-wrapper.jar
          test -f mobile/android/app/build.gradle
          test "$(find mobile/assets -maxdepth 1 -name '*.png' | wc -l)" -ge 28
          for art in hero-mystic-cutout hero-skyline-background spread-reset-energy-illustrated spread-trust-your-gut-illustrated spread-next-phase-illustrated spread-grounding-illustrated footer-skyline-background spread-trust-your-gut-three-card home-hey-mystic-illustrated avatar-sunglasses-transparent avatar-tarot-headphones-transparent; do
            test -s "mobile/assets/$art.png"
            grep -Fq "'$art.png': require('./assets/$art.png')" mobile/App.tsx
          done
          if grep -E '"expo"|"expo-status-bar"|"expo-linear-gradient"' mobile/package.json; then
            echo "Expo package found in bare React Native app" >&2
            exit 1
          fi
          if grep -E "from ['\"]expo" mobile/App.tsx; then
            echo "Expo import found" >&2
            exit 1
          fi
      - name: Install dependencies (no Expo)
        working-directory: mobile
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Type-check all React Native screens
        working-directory: mobile
        run: npm run typecheck
