services:
  - type: web
    name: auramystic-api
    runtime: python
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STORE_URL
        value: https://www.neurospicymystic.com
